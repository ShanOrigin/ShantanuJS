<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShantanuJS</title>
    <style>
      body {
        margin: 0;
        /* Background: 135° dark navy → deep purple (complements text) */
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        min-height: 100vh;
      }
      h1 {
        font-size: 3rem;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        text-align: center;
        font-weight: 800;
        padding-block: 1rem;

        /* Text: 45° red → purple → blue */
        background: linear-gradient(45deg, #ff0055, #a451db, #0066ff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      #testing {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <h1>ShantanuJS</h1>
    <div id="testing"></div>

    <script type="module" src="./test-dist/tests/tests.js"></script>
    <!-- <script type="module" src="./dist/src/index/play-ground-index.d.ts"></script> -->
  </body>
</html>
